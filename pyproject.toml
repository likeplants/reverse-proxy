[project]
name = "reverse-proxy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "acme>=5.8.0",
    "annotated-doc>=0.0.5",
    "annotated-types>=0.8.0",
    "anyio>=4.15.1",
    "certbot>=5.8.0",
    "certifi>=2026.7.22",
    "cffi>=2.1.1",
    "charset-normalizer>=3.5.1",
    "click>=8.5.0",
    "configargparse>=1.7.7",
    "configobj>=5.0.9",
    "cryptography>=50.0.1",
    "deprecated>=1.3.1",
    "distro>=1.9.0",
    "fastapi>=0.141.1",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "idna>=3.20",
    "josepy>=2.2.0",
    "limits>=5.8.0",
    "packaging>=26.3",
    "parsedatetime>=2.6",
    "pycparser>=3.0",
    "pydantic>=2.13.5",
    "pydantic-core>=2.46.5",
    "pyopenssl>=26.4.0",
    "pyrfc3339>=2.1.0",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "starlette>=1.7.0",
    "typing-extensions>=4.16.0",
    "typing-inspection>=0.4.4",
    "urllib3>=2.8.0",
    "uvicorn>=0.54.0",
    "wrapt>=2.4.1",
]

[project.scripts]
reverse-proxy = "reverse_proxy:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
